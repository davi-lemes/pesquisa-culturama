<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <main>
        <header>
        <img src="img/logo-culturama.png" alt="Logo Culturama">
        <h1>Pesquisa de opinião</h1>
    </header>
    <section>
        <form action="sucesso.html" method="get">
            <fieldset>
                

                <legend>Dados Pessoais</legend>
                <label for="name">Nome</label>
                <input id="name" type="text" name="userName" required> <!--name é ao que irá atribuir na URL do HTML por conta da solicitação do "get" no method do form // Já o "required" é um atributo que não recebe valor, é apenas para denominar um input que deve ser preenchido obrigatóriamente-->
                <br>
                <label for="age">Idade</label>
                <input id="age" type="number" name="userAge" min="12" max="100" required> <!-- Para estimular um minimo ou máximo de idade ou de algum outro requisito, podemos utilizar os atributos "min" ou "max" com os valores que queremos passar após o = -->
                <br>
                <label for="birthDate">Data de nascimento</label>
                <input id="birthDate" type="date" name="userBirthDate">
                <br>
                <label for="email">Email</label>
                <input id="email" type="email" name="userEmail" required>
                <br>
                <label for="phoneNumber">Telefone</label>
                <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + 999999999"> <!-- "tel" é um valor de atributo especifico para receber um telefone como input. // O atributo "pattern" serve para denominar quais números ou digitos (representados dentro de [] sempre) e a quantidade que queremos que seja utilizada dentro do input (representado por {} sempre) -->
                <br>
                <label for="image">Upload de foto</label>
                <input id="image" type="file" accept="image/*" name="userImage"> <!-- o "type=file" solicita um arquivo no input // o o "accept" diz qual o tipo de arquivo será aceito, o "image/*" indica que será aceito qualquer tipo de formatos de images.
                -->
            </fieldset>
            
            <fieldset>
                <legend>Perfil</legend>

                <p>Gênero:</p>
                <input id="fem" type="radio" name="userGender" value="Feminino">
                <label for="fem">Feminino</label>

                <input id="masc" type="radio" name="userGender" value="Masculino">
                <label for="masc">Masculino</label>

                <input id="notInformed" type="radio" name="userGender" value="notInformed">
                <label for="notInformed">Prefiro não informar</label>

                <br>
                <label for="maritalStatus">Estado civil:</label>
                <select id="maritalStatus" name="userMaritalStatus">
                    <option value="notInformed">Selecione...</option>
                    <option value="casado">Casado</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="Uniao estavel">União estável</option>
                </select>

                <label for="state">Estado:</label>
                <select id="state" name="userState" required>
                    <option value="acre">Acre</option>
                    <option value="alagoas">Alagoas</option>
                    <option value="amapa">Amapá</option>
                    <option value="amazonas">Amazonas</option>
                    <option value="bahia">Bahia</option>
                    <option value="ceara">Ceará</option>
                    <option value="distritoFederal">Distrito Federal</option>
                    <option value="espiritoSanto">Espirito Santo</option>
                    <option value="goias">Goiás</option>
                    <option value="maranhao">Maranhão</option>
                    <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
                    <option value="matoGrosso">Mato Grosso</option>
                    <option value="minasGerais">Minas Gerais</option>
                    <option value="para">Pará</option>
                    <option value="paraiba">Paraíba</option>
                    <option value="parana">Paraná</option>
                    <option value="pernambuco">Pernambuco</option>
                    <option value="piaui">Piauí</option>
                    <option value="rioDeJaneiro">Rio de Janeiro</option>
                    <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
                    <option value="rioGrandeDoSul">Rio Grande do Sul</option>
                    <option value="rondonia">Rondônia</option>
                    <option value="roraima">Roraima</option>
                    <option value="santaCatarina">Santa Catarina</option>
                    <option value="saoPaulo">São Paulo</option>
                    <option value="sergipe">Sergipe</option>
                    <option value="tocantins">Tocantins</option>
                </select>
                
                <br>
                <label for="city">Cidade:</label>
                <input id="city" type="text" name="userCity">

                
            </fieldset>
            
            <fieldset>
                <legend>Hábitos</legend>

                <p>Redes Sociais:</p>
                <input id="instagram" type="checkbox" name="social" value="instagram">
                <label for="instagram">Instagram</label>
                <br>
                <input id="facebook" type="checkbox" name="social" value="facebook">
                <label for="facebook">Facebook</label>
                <br>
                <input id="linkedin" type="checkbox" name="social" value="linkedin">
                <label for="linkedin">Linkedin</label>
                <br>
                <input id="x" type="checkbox" name="social" value="x">
                <label for="x">X</label>
                <br>
                <label for="musicStyle">Estilo musical:</label>
                <input list="styleTypes" id="musicStyle" type="text" name="userMusicStyle">
                <datalist id="styleTypes">
                    <option value="Rock">
                    <option value="Pop">
                    <option value="Samba">
                    <option value="Sertanejo">
                </datalist>
                <br>
                <label for="favoriteColor">Cor favorita:</label>
                <input id="favoriteColor" type="color" name="userFavoriteColor">
                <br>
            </fieldset>

            <fieldset>
                <legend>Satisfação</legend>

                <p>O que você acha da qualidade do nosso serviço?</p>

                <input id="otimo" type="radio" name="userOpinion">
                <label for="otimo">Ótimo</label>
                <br>
                <input id="bom" type="radio" name="userOpinion">
                <label for="bom">Bom</label>
                <br>
                <input id="regular" type="radio" name="userOpinion">
                <label for="regular">Regular</label>
                <br>
                <input id="ruim" type="radio" name="userOpinion">
                <label for="ruim">Ruim</label>
                <br>
                <label for="comment">Deixe seu comentário:</label>
                <br>
                <textarea name="userComment" id="comment" placeholder="Digite seu comentário aqui..."></textarea> <!-- caixa de texto redimensionável -->
            </fieldset>

            <fieldset>
                <legend>Confirmações</legend>

                <input type="checkbox" name="userLgpd" id="userLgpdTerm" value="confirmed" required>
                <label for="userLgpdTerm">Eu aceito participar da pesquisa</label><br>

                <input type="checkbox" name="userGetReult" id="getResults" value="confirmed">
                <label for="getResults">Desejo receber o resultado por email</label>
            </fieldset>

            <br>
            <button type="submit">Enviar</button> <!--Type escolhe o tipo do button. O submit significa que ele irá submeter as respostas aos inputs-->
            <button type="reset">Limpar</button> <!-- type reset serve para limpar o formulário -->
        </form>
    </section>    
</body>
</html>
    </main>
