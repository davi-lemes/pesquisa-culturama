<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>
    <section>
        <form action="" method="get">
            <fieldset>
                

                <legend>Dados Pessoais</legend>
                <label for="userName">Nome</label>
                <input type="text" name="userName" required> <!--name é ao que irá atribuir na URL do HTML por conta da solicitação do "get" no method do form // Já o "required" é um atributo que não recebe valor, é apenas para denominar um input que deve ser preenchido obrigatóriamente-->
                <br>
                <label for="userAge">Idade</label>
                <input type="number" name="userAge" min="12" max="100" required> <!-- Para estimular um minimo ou máximo de idade ou de algum outro requisito, podemos utilizar os atributos "min" ou "max" com os valores que queremos passar após o = -->
                <br>
                <label for="birthDate">Data de nascimento</label>
                <input type="date" name="birthDate">
                <br>
                <label for="userEmail">Email</label>
                <input type="email" name="userEmail" required>
                <br>
                <label for="userPhoneNumber">Telefone</label>
                <input type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + 999999999"> <!-- "tel" é um valor de atributo especifico para receber um telefone como input. // O atributo "pattern" serve para denominar quais números ou digitos (representados dentro de [] sempre) e a quantidade que queremos que seja utilizada dentro do input (representado por {} sempre) -->
                <br>
                <label for="userImage">Upload de foto</label>
                <input type="file" accept="image/*" name="userImage"> <!-- o "type=file" solicita um arquivo no input // o o "accept" diz qual o tipo de arquivo será aceito, o "image/*" indica que será aceito qualquer tipo de formatos de images.
                -->
            </fieldset>
            
            <fieldset>
                <legend>Perfil</legend>

                <p>Gênero:</p>
                <input type="radio" name="userGender" value="Feminino">
                <label for="userGender">Feminino</label>

                <input type="radio" name="userGender" value="Masculino">
                <label for="userGender">Masculino</label>

                <input type="radio" name="userGender" value="notInformed">
                <label for="userGender">Prefiro não informar</label>

                <br>
                <label for="maritalStatus">Estado civil:</label>
                <select name="maritalStatus">
                    <option value="notInformed">Selecione...</option>
                    <option value="casado">Casado</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="Uniao estavel">União estável</option>
                </select>

                <label for="userState">Estado:</label>
                <select name="userState" required>
                    <option value="acre">Acre</option>
                    <option value="alagoas">Alagoas</option>
                    <option value="amapa">Amapá</option>
                    <option value="amazonas">Amazonas</option>
                    <option value="bahia">Bahia</option>
                    <option value="ceara">Ceará</option>
                    <option value="distritoFederal">Distrito Federal</option>
                    <option value="espiritoSanto">Espirito Santo</option>
                    <option value="goias">Goiás</option>
                    <option value="maranhao">Maranhão</option>
                    <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
                    <option value="matoGrosso">Mato Grosso</option>
                    <option value="minasGerais">Minas Gerais</option>
                    <option value="para">Pará</option>
                    <option value="paraiba">Paraíba</option>
                    <option value="parana">Paraná</option>
                    <option value="pernambuco">Pernambuco</option>
                    <option value="piaui">Piauí</option>
                    <option value="rioDeJaneiro">Rio de Janeiro</option>
                    <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
                    <option value="rioGrandeDoSul">Rio Grande do Sul</option>
                    <option value="rondonia">Rondônia</option>
                    <option value="roraima">Roraima</option>
                    <option value="santaCatarina">Santa Catarina</option>
                    <option value="saoPaulo">São Paulo</option>
                    <option value="sergipe">Sergipe</option>
                    <option value="tocantins">Tocantins</option>
                </select>
                
                <label for="userCity">Cidade:</label>
                <input type="text" name="userCity">

                
            </fieldset>
            
            <br>
            <button type="submit">Enviar</button> <!--Type escolhe o tipo do button. O submit significa que ele irá submeter as respostas aos inputs-->
        </form>
    </section>    
</body>
</html>
